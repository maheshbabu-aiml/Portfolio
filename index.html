# Concrete Compressive Strength ML Pipeline: Random Forest & XGBoost
# Author: Mahesh Babu | M.Tech CSE (RGUKT Basar)
# ====================================================================
import numpy as np
import pandas as pd
from sklearn.model_selection import train_test_split, RandomizedSearchCV
from sklearn.preprocessing import StandardScaler, RobustScaler
from sklearn.metrics import r2_score, mean_squared_error
from sklearn.ensemble import RandomForestRegressor
from xgboost import XGBRegressor

def train_concrete_strength_pipeline(dataset_path: str):
    # 1. Ingest Kaggle Concrete Dataset (1,030 samples, 8 features)
    df = pd.read_csv(dataset_path)
    
    # 2. Outlier Removal using Interquartile Range (IQR Method)
    Q1 = df.quantile(0.25)
    Q3 = df.quantile(0.75)
    IQR = Q3 - Q1
    df_clean = df[~((df < (Q1 - 1.5 * IQR)) | (df > (Q3 + 1.5 * IQR))).any(axis=1)]
    
    X = df_clean.drop(columns=['compressive_strength'])
    y = df_clean['compressive_strength']
    
    # 3. Train/Test Split (80/20)
    X_train, X_test, y_train, y_test = train_test_split(
        X, y, test_size=0.20, random_state=42
    )
    
    # 4. Feature Scaling
    scaler = StandardScaler()
    X_train_scaled = scaler.fit_transform(X_train)
    X_test_scaled = scaler.transform(X_test)
    
    # 5. Model Training with Tuned Random Forest / XGBoost Regressor
    model = XGBRegressor(
        n_estimators=250,
        max_depth=6,
        learning_rate=0.04,
        subsample=0.85,
        random_state=42
    )
    model.fit(X_train_scaled, y_train)
    
    # 6. Evaluation on Test Set
    y_pred = model.predict(X_test_scaled)
    r2 = r2_score(y_test, y_pred)
    rmse = np.sqrt(mean_squared_error(y_test, y_pred))
    
    print(f"[✓] Model Validation R² Score : {r2:.4f}")
    print(f"[✓] Model Validation RMSE     : {rmse:.4f} MPa")
    return model, scaler`;

    function BankruptcyModalStandalone({ project, onClose }) {
      const [roa, setRoa] = useState(4.2);

      const [opMargin, setOpMargin] = useState(8.5);

        let z = 0.8 * (debtEquity - 1.0) - 0.15 * roa - 0.08 * opMargin - 0.45 * (currentRatio - 1.2);
        const prob = 1 / (1 + Math.exp(-z));
        return Math.min(Math.max(prob * 100, 2.5), 98.5);

      const riskScore = calculateRisk();

      const isModerateRisk = riskScore >= 35 && riskScore <= 65;

    // --- CONCRETE STRENGTH MODAL COMPONENT ---
    function ConcreteStrengthModalStandalone({ project, onClose }) {
      const [cement, setCement] = useState(380);
      const [slag, setSlag] = useState(60);
      const [flyAsh, setFlyAsh] = useState(0);
      const [water, setWater] = useState(165);
      const [superplasticizer, setSuperplasticizer] = useState(8.5);
      const [age, setAge] = useState(28);

      const calculateStrength = () => {
        const effectiveBinder = cement + 0.8 * slag + 0.5 * flyAsh;
        const wcRatio = water / (effectiveBinder || 1);
        let base = 75 - 65 * wcRatio + 0.6 * superplasticizer;
        const ageFactor = Math.log10(Math.max(age, 1)) / Math.log10(28);
        return Math.min(Math.max(base * (0.4 + 0.6 * ageFactor), 6.5), 88.0);
      };

      const strengthMpa = calculateStrength();

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md overflow-y-auto">
          <div className="relative w-full max-w-4xl glass-card rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden my-8">

                    </div>
                    <div>
                      <div className="flex justify-between mb-1">
                        <span>Fly Ash:</span>
                        <strong className="font-mono text-teal-500">{flyAsh} kg/m³</strong>
                      </div>
                      <input type="range" min="0" max="200" step="5" value={flyAsh} onChange={(e) => setFlyAsh(parseInt(e.target.value))} className="w-full accent-teal-600" />
                    </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <div className="flex justify-between mb-1">
                        <span>Water:</span>
                        <strong className="font-mono text-teal-500">{water} kg/m³</strong>

                      <input type="range" min="120" max="240" step="5" value={water} onChange={(e) => setWater(parseInt(e.target.value))} className="w-full accent-teal-600" />

                    <div>

                  🖨️ Print / Save PDF
                </button>
                <button onClick={onClose} className="p-1.5 rounded-xl text-slate-400 hover:text-white">✕</button>
              </div>
            </div>

            <div className="p-6 sm:p-10 max-h-[80vh] overflow-y-auto space-y-6 text-xs sm:text-sm text-slate-800 dark:text-slate-200">
              <div className="pb-4 border-b border-slate-200 dark:border-slate-800">
                <h1 className="text-2xl font-bold text-slate-900 dark:text-white uppercase">{personalInfo.fullName}</h1>
                <p className="text-teal-600 dark:text-teal-400 font-semibold">{personalInfo.title} • {personalInfo.degree}</p>
                <p className="text-xs text-slate-500 mt-1">Location: {personalInfo.location} | Mobile: {personalInfo.mobile} | Email: {personalInfo.email}</p>
              </div>

              <div>
                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Professional Summary</h2>
                <p className="text-slate-600 dark:text-slate-300 leading-relaxed">{personalInfo.summary}</p>
              </div>

              <div>
                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Skills Summary</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  {technicalSkills.map((c, i) => (
                    <div key={i} className="p-2 rounded bg-slate-50 dark:bg-slate-850 border border-slate-200 dark:border-slate-800">
                      <strong>{c.category}:</strong> {c.skills.map(s => s.name).join(', ')}
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Featured Projects</h2>
                <div className="space-y-2">
                  {projectsData.map((p, i) => (
                    <div key={i} className="p-2.5 rounded bg-slate-50 dark:bg-slate-850 border border-slate-200 dark:border-slate-800">
                      <div className="font-bold">{p.title} | {p.type}</div>
                      <p className="text-xs text-slate-600 dark:text-slate-400">{p.summary}</p>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Education</h2>
                <div className="space-y-1.5">
                  {educationData.map((e, i) => (
                    <div key={i} className="flex justify-between items-baseline p-2 rounded bg-slate-50 dark:bg-slate-850 border border-slate-200 dark:border-slate-800">
                      <div>
                        <strong>{e.degree}</strong> - {e.institution}, {e.location}
                      </div>
                      <div className="font-mono text-slate-500 text-xs">{e.period} {e.grade ? `(${e.grade})` : ''}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Certifications</h2>
                <div className="space-y-1">
                  {certificationsData.map((c, i) => (
                    <div key={i} className="p-2 rounded bg-slate-50 dark:bg-slate-850 border border-slate-200 dark:border-slate-800 flex justify-between">
                      <div><strong>{c.title}</strong> – {c.issuer} ({c.topics})</div>
                      <span className="text-emerald-500 font-mono text-xs">✓ Verified</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
