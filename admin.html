<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Messages Dashboard | Mahesh Babu Macharla</title>

  <!-- Google Fonts: Inter & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ai: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
              950: '#042f2e',
            },
            slate: {
              850: '#151f32',
              900: '#0f172a',
              950: '#080d1a',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.05);
    }
    .dark ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    /* Glassmorphism */
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .dark .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
    .dark .glass-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.4);
    }
    .bg-grid-pattern {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
    }
    .dark .bg-grid-pattern {
      background-image: 
        linear-gradient(to right, rgba(51, 65, 85, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(51, 65, 85, 0.25) 1px, transparent 1px);
    }
  </style>
</head>
<body class="antialiased font-sans text-slate-900 bg-slate-50 dark:bg-[#090d16] dark:text-slate-100 transition-colors duration-300 min-h-screen bg-grid-pattern">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AdminApp() {
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('aiml-theme');
        if (saved !== null) return saved === 'dark';
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      });

      // Authentication State
      const [authToken, setAuthToken] = useState(() => localStorage.getItem('aiml_admin_token') || '');
      const [authUser, setAuthUser] = useState(() => localStorage.getItem('aiml_admin_user') || '');

      // Login Form State
      const [loginUserId, setLoginUserId] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [loginError, setLoginError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      // Dashboard Data State
      const [messages, setMessages] = useState([]);
      const [stats, setStats] = useState({ total: 0, new: 0, read: 0 });
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [statusFilter, setStatusFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [actionToast, setActionToast] = useState(null);

      // API Base
      const API_BASE = window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1')
        ? ''
        : 'http://localhost:5000';

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('aiml-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('aiml-theme', 'light');
        }
      }, [darkMode]);

      const showToast = (text, type = 'success') => {
        setActionToast({ text, type });
        setTimeout(() => setActionToast(null), 3000);
      };

      // ----------------------------------------------------------------
      // Authentication Handlers
      // ----------------------------------------------------------------
      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        if (!loginUserId.trim() || !loginPassword.trim()) {
          setLoginError('Please enter both User ID and Password.');
          return;
        }

        setIsLoggingIn(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: loginUserId.trim(), password: loginPassword })
          });

          const data = await res.json();
          if (res.ok && data.success && data.token) {
            setAuthToken(data.token);
            setAuthUser(data.user || loginUserId.trim());
            localStorage.setItem('aiml_admin_token', data.token);
            localStorage.setItem('aiml_admin_user', data.user || loginUserId.trim());
            setLoginPassword('');
            showToast(`Welcome back, ${data.user || 'Mahesh Babu'}!`);
          } else {
            throw new Error(data.error || 'Invalid User ID or Password.');
          }
        } catch (err) {
          setLoginError(err.message || 'Login failed. Please check your credentials.');
        } finally {
          setIsLoggingIn(false);
        }
      };

      const handleLogout = () => {
        setAuthToken('');
        setAuthUser('');
        localStorage.removeItem('aiml_admin_token');
        localStorage.removeItem('aiml_admin_user');
        setMessages([]);
        setStats({ total: 0, new: 0, read: 0 });
        showToast('Logged out successfully.');
      };

      // ----------------------------------------------------------------
      // Dashboard Data Handlers (Protected)
      // ----------------------------------------------------------------
      const fetchDashboardData = async () => {
        if (!authToken) return;
        setLoading(true);
        setError(null);
        try {
          const authHeaders = {
            'Authorization': `Bearer ${authToken}`,
            'Content-Type': 'application/json'
          };

          // 1. Fetch Stats
          const statsRes = await fetch(`${API_BASE}/api/stats`, { headers: authHeaders });
          if (statsRes.status === 401) {
            handleLogout();
            setLoginError('Session expired. Please log in again.');
            return;
          }
          if (statsRes.ok) {
            const statsData = await statsRes.json();
            if (statsData.stats) setStats(statsData.stats);
          }

          // 2. Fetch Messages
          const res = await fetch(`${API_BASE}/api/messages`, { headers: authHeaders });
          if (res.status === 401) {
            handleLogout();
            setLoginError('Session expired. Please log in again.');
            return;
          }
          if (!res.ok) throw new Error(`HTTP ${res.status}: Failed to load messages.`);

          const data = await res.json();
          setMessages(data.messages || []);
        } catch (err) {
          setError(err.message || 'Failed to load messages from backend.');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (authToken) {
          fetchDashboardData();
          const interval = setInterval(fetchDashboardData, 20000);
          return () => clearInterval(interval);
        }
      }, [authToken]);

      const handleToggleStatus = async (msg) => {
        const nextStatus = msg.status === 'new' ? 'read' : 'new';
        try {
          const res = await fetch(`${API_BASE}/api/messages/${msg.id}`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({ status: nextStatus })
          });

          if (res.status === 401) {
            handleLogout();
            return;
          }
          if (!res.ok) throw new Error('Failed to update message status.');

          // Update local UI immediately
          setMessages(prev => prev.map(m => m.id === msg.id ? { ...m, status: nextStatus } : m));
          setStats(prev => ({
            ...prev,
            new: nextStatus === 'new' ? prev.new + 1 : Math.max(0, prev.new - 1),
            read: nextStatus === 'read' ? prev.read + 1 : Math.max(0, prev.read - 1)
          }));

          showToast(`Message marked as ${nextStatus.toUpperCase()}`);
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleDelete = async (msgId) => {
        if (!window.confirm(`Are you sure you want to permanently delete message #${msgId}?`)) {
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/api/messages/${msgId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${authToken}` }
          });

          if (res.status === 401) {
            handleLogout();
            return;
          }
          if (!res.ok) throw new Error('Failed to delete message.');

          setMessages(prev => prev.filter(m => m.id !== msgId));
          fetchDashboardData();
          showToast(`Message #${msgId} deleted successfully.`);
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      // Filter & Search
      const filteredMessages = messages.filter(m => {
        if (statusFilter !== 'all' && m.status !== statusFilter) return false;
        if (!searchQuery.trim()) return true;
        const q = searchQuery.toLowerCase();
        return (
          m.name.toLowerCase().includes(q) ||
          m.email.toLowerCase().includes(q) ||
          (m.company && m.company.toLowerCase().includes(q)) ||
          (m.subject && m.subject.toLowerCase().includes(q)) ||
          m.message.toLowerCase().includes(q)
        );
      });

      // ================================================================
      // 1. RENDER LOGIN SCREEN (IF NOT AUTHENTICATED)
      // ================================================================
      if (!authToken) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="w-full max-w-md">
              {/* Theme Toggle Button */}
              <div className="flex justify-end mb-4">
                <button
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-750 bg-white dark:bg-slate-850 text-slate-700 dark:text-slate-300 shadow-sm"
                >
                  {darkMode ? '☀️' : '🌙'}
                </button>
              </div>

              <div className="glass-card rounded-3xl p-8 border border-slate-200/90 dark:border-slate-800 shadow-2xl relative overflow-hidden">
                <div className="text-center mb-8">
                  <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-teal-500 to-indigo-600 flex items-center justify-center text-white font-extrabold text-2xl mx-auto shadow-lg shadow-teal-500/25 mb-4">
                    MB
                  </div>
                  <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                    Admin Portal Access
                  </h1>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                    Protected Inquiries Dashboard for <strong>Mahesh Babu Macharla</strong>
                  </p>
                </div>

                {loginError && (
                  <div className="p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-rose-800 dark:text-rose-300 text-xs mb-5 animate-in fade-in duration-200">
                    <strong className="block font-semibold">Authentication Error</strong>
                    <span>{loginError}</span>
                  </div>
                )}

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">
                      User ID
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Mahesh Babu"
                      value={loginUserId}
                      onChange={(e) => setLoginUserId(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-white dark:bg-slate-850 border border-slate-200 dark:border-slate-750 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500 transition-all font-medium"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">
                      Password
                    </label>
                    <div className="relative">
                      <input
                        type={showPassword ? 'text' : 'password'}
                        required
                        placeholder="••••••••••••"
                        value={loginPassword}
                        onChange={(e) => setLoginPassword(e.target.value)}
                        className="w-full px-4 py-3 pr-10 rounded-xl bg-white dark:bg-slate-850 border border-slate-200 dark:border-slate-750 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500 transition-all font-medium"
                      />
                      <button
                        type="button"
                        onClick={() => setShowPassword(!showPassword)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs"
                      >
                        {showPassword ? '🙈' : '👁️'}
                      </button>
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={isLoggingIn}
                    className="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-teal-600 to-indigo-600 hover:from-teal-500 hover:to-indigo-500 text-white font-semibold text-xs shadow-lg shadow-teal-500/25 transition-all hover:scale-[1.01] active:scale-[0.99] disabled:opacity-60 cursor-pointer mt-2"
                  >
                    {isLoggingIn ? 'Verifying Credentials...' : 'Sign In to Messages Dashboard →'}
                  </button>
                </form>

                <div className="mt-6 pt-5 border-t border-slate-200 dark:border-slate-800 text-center">
                  <a
                    href="index.html"
                    className="text-xs font-medium text-teal-600 dark:text-teal-400 hover:underline"
                  >
                    ← Return to Portfolio Website
                  </a>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ================================================================
      // 2. RENDER AUTHENTICATED DASHBOARD
      // ================================================================
      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
          {/* Header */}
          <header className="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-slate-200 dark:border-slate-800 gap-4 mb-8">
            <div className="flex items-center gap-3">
              <div className="w-11 h-11 rounded-xl bg-gradient-to-tr from-teal-500 to-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-teal-500/20">
                MB
              </div>
              <div>
                <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight flex items-center gap-2">
                  Admin Messages Dashboard
                  <span className="text-[11px] font-mono px-2.5 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 font-semibold border border-emerald-200 dark:border-emerald-800">
                    🔒 Secured Access
                  </span>
                </h1>
                <p className="text-xs text-slate-500 dark:text-slate-400">
                  Logged in as: <strong className="text-slate-800 dark:text-slate-200">{authUser || 'Mahesh Babu'}</strong>
                </p>
              </div>
            </div>

            <div className="flex items-center gap-3 flex-wrap">
              <a
                href="index.html"
                className="px-3.5 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-750 transition-colors shadow-sm"
              >
                ← View Portfolio
              </a>

              <a
                href={`${API_BASE}/api/export?token=${encodeURIComponent(authToken)}`}
                className="px-3.5 py-2 rounded-xl text-xs font-semibold bg-teal-600 hover:bg-teal-500 text-white shadow-sm transition-colors flex items-center gap-1.5"
                title="Download CSV of all messages"
              >
                📥 Export CSV
              </a>

              <button
                onClick={() => setDarkMode(!darkMode)}
                className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
                title="Toggle Dark / Light Mode"
              >
                {darkMode ? '☀️' : '🌙'}
              </button>

              <button
                onClick={handleLogout}
                className="px-3.5 py-2 rounded-xl text-xs font-semibold bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-300 border border-rose-200 dark:border-rose-900 hover:bg-rose-100 transition-colors"
                title="Log out of admin session"
              >
                🔒 Log Out
              </button>
            </div>
          </header>

          {/* Action Toast */}
          {actionToast && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold animate-in fade-in slide-in-from-top-2 duration-200 ${
              actionToast.type === 'error'
                ? 'bg-rose-600 text-white'
                : 'bg-emerald-600 text-white'
            }`}>
              {actionToast.text}
            </div>
          )}

          {/* KPI Metrics Bar */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div className="glass-card rounded-2xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center justify-between">
              <div>
                <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider block">Total Inquiries</span>
                <span className="text-3xl font-extrabold text-slate-900 dark:text-white font-mono">{stats.total}</span>
              </div>
              <div className="w-12 h-12 rounded-xl bg-teal-50 dark:bg-teal-950/60 text-teal-600 dark:text-teal-400 flex items-center justify-center text-xl font-bold border border-teal-200/40">
                📨
              </div>
            </div>

            <div className="glass-card rounded-2xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center justify-between">
              <div>
                <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider block">New / Unread</span>
                <span className="text-3xl font-extrabold text-amber-500 font-mono">{stats.new}</span>
              </div>
              <div className="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-950/60 text-amber-500 flex items-center justify-center text-xl font-bold border border-amber-200/40">
                ⭐
              </div>
            </div>

            <div className="glass-card rounded-2xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center justify-between">
              <div>
                <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider block">Read / Processed</span>
                <span className="text-3xl font-extrabold text-emerald-500 font-mono">{stats.read}</span>
              </div>
              <div className="w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-500 flex items-center justify-center text-xl font-bold border border-emerald-200/40">
                ✓
              </div>
            </div>
          </div>

          {/* Filter & Search Bar */}
          <div className="glass-card rounded-2xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
              <button
                onClick={() => setStatusFilter('all')}
                className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                  statusFilter === 'all'
                    ? 'bg-teal-600 text-white shadow-sm'
                    : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700'
                }`}
              >
                All ({messages.length})
              </button>
              <button
                onClick={() => setStatusFilter('new')}
                className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                  statusFilter === 'new'
                    ? 'bg-amber-500 text-white shadow-sm'
                    : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700'
                }`}
              >
                ⭐ New ({stats.new})
              </button>
              <button
                onClick={() => setStatusFilter('read')}
                className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                  statusFilter === 'read'
                    ? 'bg-emerald-600 text-white shadow-sm'
                    : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700'
                }`}
              >
                ✓ Read ({stats.read})
              </button>
            </div>

            <div className="flex items-center gap-2 w-full md:w-80">
              <input
                type="text"
                placeholder="Search by name, email, message..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full px-3.5 py-2 rounded-xl bg-white dark:bg-slate-850 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500/30"
              />
              <button
                onClick={fetchDashboardData}
                className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs"
                title="Refresh from database"
              >
                🔄
              </button>
            </div>
          </div>

          {/* Messages Table / List */}
          {loading ? (
            <div className="text-center py-16 glass-card rounded-2xl border border-slate-200 dark:border-slate-800">
              <div className="text-teal-600 dark:text-teal-400 text-sm font-semibold animate-pulse">
                Loading messages from SQLite database...
              </div>
            </div>
          ) : error ? (
            <div className="p-6 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-center text-rose-800 dark:text-rose-300 text-xs">
              <strong className="block text-sm font-bold mb-1">Server Connection Error</strong>
              <p>{error}</p>
              <button
                onClick={fetchDashboardData}
                className="mt-3 px-4 py-1.5 rounded-lg bg-rose-600 text-white font-semibold hover:bg-rose-500 transition-colors"
              >
                Retry Connection
              </button>
            </div>
          ) : filteredMessages.length === 0 ? (
            <div className="text-center py-16 glass-card rounded-2xl border border-slate-200 dark:border-slate-800">
              <p className="text-slate-500 dark:text-slate-400 text-sm">
                No recruiter messages found matching the selected filter.
              </p>
            </div>
          ) : (
            <div className="space-y-3">
              {filteredMessages.map((msg) => {
                const isNew = msg.status === 'new';
                return (
                  <div
                    key={msg.id}
                    className={`glass-card rounded-2xl p-5 border transition-all ${
                      isNew
                        ? 'border-teal-500/50 bg-teal-50/20 dark:bg-teal-950/20 shadow-sm'
                        : 'border-slate-200/80 dark:border-slate-800 opacity-90'
                    }`}
                  >
                    <div className="flex flex-col md:flex-row md:items-start justify-between gap-3 pb-3 border-b border-slate-200/60 dark:border-slate-800">
                      <div>
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="font-bold text-base text-slate-900 dark:text-white">
                            {msg.name}
                          </span>
                          {isNew ? (
                            <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-300 font-bold border border-amber-200">
                              ⭐ NEW
                            </span>
                          ) : (
                            <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500">
                              ✓ READ
                            </span>
                          )}
                          {msg.company && (
                            <span className="text-xs font-medium px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                              🏢 {msg.company}
                            </span>
                          )}
                        </div>

                        <div className="flex flex-wrap items-center gap-3 text-xs text-slate-500 mt-1">
                          <a
                            href={`mailto:${msg.email}`}
                            className="text-teal-600 dark:text-teal-400 hover:underline font-mono"
                          >
                            ✉️ {msg.email}
                          </a>
                          <span>•</span>
                          <span className="font-mono">{msg.created_at}</span>
                        </div>
                      </div>

                      {/* Actions */}
                      <div className="flex items-center gap-2 self-start md:self-auto">
                        <button
                          onClick={() => handleToggleStatus(msg)}
                          className={`px-3 py-1.5 rounded-xl text-xs font-semibold border transition-colors ${
                            isNew
                              ? 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800 hover:bg-emerald-100'
                              : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 hover:bg-slate-200'
                          }`}
                          title="Toggle read status"
                        >
                          {isNew ? 'Mark as Read' : 'Mark as New'}
                        </button>

                        <a
                          href={`mailto:${msg.email}?subject=Re: ${encodeURIComponent(msg.subject || 'AI/ML Engineer Opportunity')}&body=Hi ${encodeURIComponent(msg.name)},%0D%0A%0D%0AThank you for reaching out through my portfolio...`}
                          className="px-3 py-1.5 rounded-xl text-xs font-semibold bg-teal-600 hover:bg-teal-500 text-white transition-colors"
                        >
                          Reply
                        </a>

                        <button
                          onClick={() => handleDelete(msg.id)}
                          className="px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-900 hover:bg-rose-100 transition-colors"
                          title="Delete message permanently"
                        >
                          🗑️
                        </button>
                      </div>
                    </div>

                    {/* Subject & Message Content */}
                    <div className="pt-3">
                      {msg.subject && (
                        <div className="text-xs font-bold text-slate-800 dark:text-slate-200 mb-1">
                          Subject: {msg.subject}
                        </div>
                      )}
                      <p className="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-line bg-slate-50/50 dark:bg-slate-850/50 p-3.5 rounded-xl border border-slate-100 dark:border-slate-800">
                        {msg.message}
                      </p>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
